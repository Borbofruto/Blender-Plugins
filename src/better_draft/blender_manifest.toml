schema_version = "1.0.0"
id = "better_draft"
name = "Better Draft"
version = "0.1.1"
tagline = "Export flat mesh outlines to DXF with real arcs and circles"
maintainer = "Gabriel Webber do Nascimento"
website = "https://github.com/Borbofruto/Blender-Plugins"
copyright = ["2026 Gabriel Webber do Nascimento"]
type = "add-on"
tags = ["Import-Export"]
blender_version_min = "4.2.0"
license = ["SPDX:GPL-3.0-or-later"]

# Pure-Python wheels installed by Blender from this archive (no download).
# ezdxf: MIT. fonttools: MIT. pyparsing: MIT. typing_extensions: PSF-2.0.
wheels = [
  "./wheels/ezdxf-1.4.5-py3-none-any.whl",
  "./wheels/fonttools-4.68.0-py3-none-any.whl",
  "./wheels/pyparsing-3.3.3-py3-none-any.whl",
  "./wheels/typing_extensions-4.16.0-py3-none-any.whl",
]

[permissions]
files = "Write DXF and report files chosen in the export dialog"
